server {
    listen 80 default_server;
    server_name ai.happysocial.xyz _;
    root /var/www/html;

    # 直接返回静态页面测试
    location / {
        return 200 "<!DOCTYPE html><html><body><h1>约吧服务运行中 ✅</h1><p>Nginx OK!</p></body></html>";
        add_header Content-Type text/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
